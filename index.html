<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Detective Terminal</title>
<tyles.css
</head>

<body>

<div class="header">
PIETERSE INVESTIGATIONS
</div>

<div class="toolbar">

<button onclick="showImport()">
IMPORT CASE
</button>

<button onclick="exportCase()">
EXPORT CASE
</button>

<select id="agent">
<option value="gm">Game Master</option>
<option value="forensics">Forensics</option>
<option value="police">Police Database</option>
<option value="suspect">Suspect</option>
</select>

<select id="suspectSelect">
<option value="">Choose Suspect</option>
</select>

</div>

<div class="casePanel">

<div>
<b>Case:</b>
<span id="caseTitle">No Case Loaded</span>
</div>

<div>
<b>Victim:</b>
<span id="victim">Unknown</span>
</div>

<div>
<b>Setting:</b>
<span id="setting">Unknown</span>
</div>

</div>

<div id="importPanel">

<h3>Paste Case JSON</h3>

<textarea id="caseJson"></textarea>

<button onclick="importCase()">
LOAD CASE
</button>

</div>

<div id="chat"></div>

<div class="inputRow">

<input
id="message"
placeholder="Enter command">

<button onclick="sendMessage()">
SEND
</button>

</div>

<h3>Case Notes</h3>

<textarea id="notes"></textarea>

app.jsscript>

</body>
</html>
